<!DOCTYPE html>
<html>
<head>
<style>
body {
    font-family: Arial, sans-serif;
    background-color: #9fc7bb;
    text-align: center;
    margin: 0;
    padding: 20px;
}

h1 {
    color: #2c3e50;
    font-size: 40px;
    margin-bottom: 10px;
}

h2 {
    color: #34495e;
    font-weight: normal;
    margin-bottom: 20px;
}

p {
    color: #555;
    font-size: 18px;
}

a {
    display: inline-block;
    margin: 15px 0;
    padding: 10px 20px;
    background-color: #3498db;
    color: white;
    text-decoration: none;
    border-radius: 5px;
}

a:hover {
    background-color: #2980b9;
}

img {
    margin-top: 20px;
    border-radius: 10px;
    max-width: 90%;
    height: auto;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

button {
    margin-top: 20px;
    padding: 10px 20px;
    border: none;
    background-color: #16a085;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}
</style>
</head>

<body>

<h1 title="I'm a header">Karthik S</h1>

<h2 id="role">I'm an Engineering student..</h2>

<p>I'm studying in Mangalore Institute of Technology and Engineering college</p>

<a href="https://karthik-s-ui.github.io/sem-4fet/">
    Home page link
</a>

<br>

<button onclick="changeRole()">
    Change Role
</button>

<br>

<img src="https://mite.ac.in/wp-content/uploads/2019/09/mite-home-slider-1.jpg"
alt="College Image" width="500">

<script>

function changeRole(){

    // Alert demonstration
    alert("You are about to change your role!");

    // Prompt demonstration
    let newRole = prompt(
        "Enter your new role:",
        document.getElementById("role").innerHTML
    );

    // Validation using JavaScript
    if(newRole != null && newRole != ""){

        document.getElementById("role").innerHTML = newRole;

        alert("Role updated successfully!");

    }
    else{

        alert("Invalid input! No changes made.");

    }
}

</script>

</body>
</html>
</html>
