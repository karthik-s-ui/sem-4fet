<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Form Example</title>

<style>

    body{
        font-family:Arial;
        background:#7fa89b;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }

    .container{
        background:#9fc7bb;
        padding:30px;
        border-radius:15px;
        width:400px;
        box-shadow:0 0 15px rgba(0,0,0,0.2);
        text-align:center;
    }

    h1{
        text-align:center;
        color:#134e4a;
        margin-bottom:20px;
    }

    fieldset{
        border:2px solid #134e4a;
        border-radius:10px;
        padding:15px;
        margin-bottom:20px;
        text-align:left;
    }

    legend{
        font-weight:bold;
        color:#134e4a;
        padding:0 10px;
    }

    label{
        display:block;
        margin:10px 0;
        color:#1e293b;
        font-weight:bold;
    }

    button{
        width:100%;
        padding:12px;
        border:none;
        border-radius:8px;
        background:#134e4a;
        color:white;
        font-size:16px;
        cursor:pointer;
    }

    button:hover{
        background:#0f766e;
    }

    #result{
        margin-top:20px;
        background:#d7ebe4;
        padding:15px;
        border-radius:10px;
        color:#1e293b;
        font-weight:bold;
    }

    .nav-buttons a{
        text-decoration:none;
    }

    .nav-buttons button{
        margin-top:10px;
        width:auto;
        padding:10px 15px;
    }

</style>
</head>

<body>

<div class="container">

    <h1>Student Form</h1>

    <!-- FIELDSET & LEGEND -->
    <fieldset>

        <legend>Select Gender</legend>

        <!-- RADIO BUTTONS -->
        <label>
            <input type="radio" name="gender" value="Male">
            Male
        </label>

        <label>
            <input type="radio" name="gender" value="Female">
            Female
        </label>

    </fieldset>

    <fieldset>

        <legend>Select Skills</legend>

        <!-- CHECKBOXES -->
        <label>
            <input type="checkbox" value="HTML">
            HTML
        </label>

        <label>
            <input type="checkbox" value="CSS">
            CSS
        </label>

        <label>
            <input type="checkbox" value="JavaScript">
            JavaScript
        </label>

        <label>
            <input type="checkbox" value="Python">
            Python
        </label>

    </fieldset>

    <button onclick="showData()">
        Submit
    </button>

    <div id="result">

        Result will appear here

    </div>

    <br>

    <!-- Navigation Buttons -->
    <div class="nav-buttons">

        <!-- Previous Assignment -->
        <a href="https://karthik-s-ui.github.io/sem-4fet/assignment/cssone.html">
            <button>
                <- Previous Assignment
            </button>
        </a>

        <!-- Home Page -->
        <a href="https://karthik-s-ui.github.io/sem-4fet/assignment/KarthikHomepage.html">
            <button>
                Home Page
            </button>
        </a>

        <!-- Next Assignment -->
        <a href="https://karthik-s-ui.github.io/sem-4fet/assignment/two_js_css.html">
            <button>
                Tenth Assignment ->
            </button>
        </a>

    </div>

</div>

<script>

function showData(){

    // RADIO BUTTON
    let gender = "";

    let genderButtons =
    document.getElementsByName("gender");

    // FOR LOOP
    for(let i = 0; i < genderButtons.length; i++){

        if(genderButtons[i].checked){

            gender = genderButtons[i].value;
        }
    }

    // CHECKBOXES
    let skills = "";

    let checkboxes =
    document.querySelectorAll(
    'input[type="checkbox"]'
    );

    // FOR LOOP
    for(let i = 0; i < checkboxes.length; i++){

        if(checkboxes[i].checked){

            skills += checkboxes[i].value + " ";
        }
    }

    // DISPLAY RESULT
    document.getElementById("result").innerHTML =

    "Selected Gender : " + gender +
    "<br><br>" +
    "Selected Skills : " + skills;

}

</script>

</body>
</html>
