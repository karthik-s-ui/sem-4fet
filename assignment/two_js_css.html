<!DOCTYPE html>
<html>
<head>
    <title>Technical Skills List</title>

    <style>
        body {
            background-color: #9fc7bb;
            font-family: Arial;
            padding: 20px;
        }

        input, select, button {
            margin: 5px;
            padding: 8px;
        }

        ul {
            background: white;
            padding: 10px;
            border-radius: 5px;
        }

        .nav-buttons{
            margin-top: 30px;
        }

        .nav-buttons a{
            text-decoration: none;
        }

        .nav-buttons button{
            background-color: #134e4a;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            padding: 10px 15px;
        }

        .nav-buttons button:hover{
            background-color: #0f766e;
        }
    </style>
</head>

<body>

<h1>Technical Skills</h1>

<input id="skillInput" placeholder="Enter skill">

<select id="categorySelect">
    <option value="prog">Programming Languages</option>
    <option value="tools">Tools & Technologies</option>
    <option value="core">Core Computer Science</option>
</select>

<button onclick="addSkill()">Add</button>
<button onclick="removeSkill()">Remove</button>

<ol>
    <li>Programming Languages
        <ul id="prog">
            <li>C</li>
            <li>Python</li>
            <li>Java</li>
        </ul>
    </li>

    <li>Tools & Technologies
        <ul id="tools">
            <li>VS Code</li>
            <li>Git</li>
            <li>Linux</li>
        </ul>
    </li>

    <li>Core Computer Science
        <ul id="core">
            <li>Programming</li>
            <li>Data Structures</li>
            <li>Algorithms</li>
        </ul>
    </li>
</ol>

<!-- Navigation Buttons -->
<div class="nav-buttons">

    <!-- Previous Assignment -->
    <a href="https://karthik-s-ui.github.io/sem-4fet/assignment/csstwo.html">
        <button>
            <- Previous Assignment
        </button>
    </a>

    <!-- Home Page -->
    <a href="https://karthik-s-ui.github.io/sem-4fet/assignment/KarthikHomepage.html">
        <button>
            Home Page
        </button>
    </a>

    <!-- Next Assignment -->
    <a href="https://karthik-s-ui.github.io/sem-4fet/assignment/Zindex">
        <button>
            11'th Assignment ->
        </button>
    </a>

</div>

<script>
function getList() {
    debugger;
    return document.getElementById(categorySelect.value);
}

function addSkill() {
    debugger;

    let val = skillInput.value.trim();

    if (!val)
        return alert("Enter skill");

    let list = getList();

    for (let li of list.children) {
        if (li.textContent.toLowerCase() === val.toLowerCase())
            return alert("Already exists");
    }

    list.innerHTML += `<li>${val}</li>`;
    skillInput.value = "";
}

function removeSkill() {
    debugger;

    let val = skillInput.value.trim().toLowerCase();
    let list = getList();

    for (let li of list.children) {
        if (li.textContent.toLowerCase() === val) {
            li.remove();
            skillInput.value = "";
            return;
        }
    }

    alert("Not found");
}
</script>

</body>
</html>
